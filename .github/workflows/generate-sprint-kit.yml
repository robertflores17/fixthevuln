name: Generate Patch Tuesday Sprint Kit

on:
  schedule:
    # Wednesday after 2nd Tuesday (Patch Tuesday) at 12PM Pacific (20:00 UTC)
    # 2nd Tuesday falls on days 8-14, so Wednesday after is days 9-15.
    # Cron ORs day-of-month with day-of-week, so '9-15 * 3' would fire every
    # day 9-15 AND every Wednesday. Run days 9-15 and let the gate job pick Wednesday.
    - cron: '0 20 9-15 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Target month (YYYY-MM format, e.g. 2026-03)'
        required: false
        type: string

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%u)" = "3" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  generate-and-upload:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'  # wrangler 4.x requires Node >=22

      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-sprint-kit.txt

      - name: Install wrangler
        run: npm ci --ignore-scripts --prefix tools/wrangler

      - name: Fetch latest KEV data
        run: python scripts/fetch_kev.py

      - name: Generate Sprint Kit PDF
        id: generate
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TARGET_MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ -n "$TARGET_MONTH" ]; then
            python scripts/generate_sprint_kit.py --month "$TARGET_MONTH"
          else
            python scripts/generate_sprint_kit.py
          fi

      - name: Upload PDF to R2
        if: steps.generate.outputs.has_cves != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Find the generated PDF
          PDF_FILE=$(ls data/sprint-kits/patch-sprint-kit-*.pdf 2>/dev/null | head -1)
          if [ -z "$PDF_FILE" ]; then
            echo "Error: No PDF found in data/sprint-kits/"
            exit 1
          fi
          PDF_NAME=$(basename "$PDF_FILE")

          echo "Uploading $PDF_NAME to R2..."
          # --remote: wrangler v4 defaults to a local simulated bucket, so
          # without it every upload "completed" on the runner and never reached R2.
          tools/wrangler/node_modules/.bin/wrangler r2 object put "fixthevuln-planners/$PDF_NAME" \
            --remote \
            --file="$PDF_FILE" \
            --content-type="application/pdf"

          echo "pdf_name=$PDF_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit manifest update
        if: steps.generate.outputs.has_cves != 'false'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add data/sprint-kit-manifest.json
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "Update sprint kit manifest ($(date +'%Y-%m-%d'))"
            git push
          fi

      # Scheduled runs only: manual runs regenerate past months and must not email anyone.
      # The worker also refuses a second delivery for the same month.
      - name: Email kit to subscribers
        if: steps.generate.outputs.has_cves != 'false' && github.event_name == 'schedule'
        env:
          KIT_DELIVERY_SECRET: ${{ secrets.KIT_DELIVERY_SECRET }}
          PDF_NAME: ${{ steps.generate.outputs.filename }}
        run: |
          MONTH="${PDF_NAME#patch-sprint-kit-}"
          MONTH="${MONTH%.pdf}"
          # Header via stdin so the secret never appears in the process list
          curl --fail-with-body -sS -X POST \
            https://fixthevuln-checkout.robertflores17.workers.dev/sprint-kit/deliver \
            -H @- \
            -H "Content-Type: application/json" \
            -d "{\"month\": \"$MONTH\"}" <<< "Authorization: Bearer $KIT_DELIVERY_SECRET"

      - name: Summary
        if: always()
        env:
          CVE_COUNT: ${{ steps.generate.outputs.cve_count }}
        run: |
          echo "### Patch Tuesday Sprint Kit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/sprint-kit-manifest.json" ]; then
            echo "Manifest:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat data/sprint-kit-manifest.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CVE count: $CVE_COUNT" >> "$GITHUB_STEP_SUMMARY"
