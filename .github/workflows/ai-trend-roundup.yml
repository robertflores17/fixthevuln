name: AI Security Trend Roundup

on:
  schedule:
    # Every Friday at 6:00 AM PT (14:00 UTC) — separate from Tuesday blog cycle
    - cron: '0 14 * * 5'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Aggregate AI security news
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          python3 scripts/aggregate_ai_security_news.py \
            --days "$DAYS"

      - name: Aggregate AI vulnerability intel
        run: |
          python3 scripts/aggregate_ai_vuln_intel.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the fresh draft now instead of waiting for Tuesday's blog job.
      # The draft sat 4 days, so the newest roundup on the site was always 10+
      # days behind (Oct 2026). Tuesday's publish_editorial.py run stays as the
      # catch-all for hand-written drafts.
      - name: Publish roundup
        run: |
          python3 scripts/publish_editorial.py
          python3 scripts/generate_llms_txt.py

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain drafts/ blog/ sitemap.xml llms.txt llms-full.txt data/blog_metadata.json data/ai-security-trends.json data/ai_news_seen.json data/ai-vuln-intel.json) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit digest
        if: steps.changes.outputs.changes == 'true'
        run: |
          git config user.name "FixTheVuln Bot"
          git config user.email "bot@fixthevuln.com"
          git add drafts/ blog/ sitemap.xml llms.txt llms-full.txt data/blog_metadata.json data/ai-security-trends.json data/ai_news_seen.json data/ai-vuln-intel.json
          git commit -m "AI security trend roundup $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Summary
        if: steps.changes.outputs.changes == 'true'
        run: |
          echo "## AI Security Trend Roundup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          DIGEST=$(ls -t drafts/ai-security-roundup-*.md 2>/dev/null | head -1)
          if [ -n "$DIGEST" ]; then
            echo "Draft: \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -30 "$DIGEST" >> $GITHUB_STEP_SUMMARY
          fi

      - name: No new items
        if: steps.changes.outputs.changes == 'false'
        run: echo "No new AI security items this week." >> $GITHUB_STEP_SUMMARY
